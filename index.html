<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Quản Lý Bệnh Nhân - EMR Pro Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0d9488', secondary: '#0f766e', accent: '#f43f5e', surface: '#f8fafc' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .nav-item.active { background-color: #e0f2fe; color: #0369a1; border-right: 4px solid #0284c7; }
        .tab-btn.active { border-bottom: 2px solid #0d9488; color: #0d9488; font-weight: 600; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .modal-enter { animation: modalEnter 0.2s ease-out forwards; }
        @keyframes modalEnter { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .action-group { opacity: 0; transition: opacity 0.2s ease; }
        @media (max-width: 768px) { .action-group { opacity: 1; } }
        .hover-reveal-container:hover .action-group { opacity: 1; }
        .filter-pill.active { background-color: #0d9488; color: white; border-color: #0d9488; }
        
        /* Loading Screen overlay */
        #app-loader { transition: opacity 0.3s; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800 relative">

    <!-- Loading Screen -->
    <div id="app-loader" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-4"></i>
        <p class="text-slate-600 font-medium">Đang kết nối cơ sở dữ liệu Cloud...</p>
    </div>

    <div id="mobile-sidebar-backdrop" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden" onclick="ui.closeSidebar()"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out bg-white border-r border-slate-200 flex flex-col shadow-2xl md:shadow-sm">
        <div class="h-16 flex items-center justify-between px-6 border-b border-slate-100">
            <div class="flex items-center cursor-pointer hover:bg-slate-50 transition-colors" onclick="app.navigate('dashboard')">
                <i class="fa-solid fa-hospital-user text-primary text-2xl mr-3"></i>
                <span class="font-bold text-lg tracking-tight text-slate-800">MediCare Pro</span>
            </div>
            <button class="md:hidden text-slate-400 hover:text-rose-500 p-2" onclick="ui.closeSidebar()"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <nav class="flex-1 py-4 overflow-y-auto">
            <ul class="space-y-1">
                <li><a onclick="app.navigate('dashboard')" id="nav-dashboard" class="nav-item active flex items-center px-6 py-3 text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer"><i class="fa-solid fa-chart-pie w-6"></i> Dashboard</a></li>
                <li><a onclick="app.navigate('patients')" id="nav-patients" class="nav-item flex items-center px-6 py-3 text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer"><i class="fa-solid fa-users w-6"></i> Quản Lý Bệnh Nhân</a></li>
                <li><a onclick="app.navigate('appointments')" id="nav-appointments" class="nav-item flex items-center px-6 py-3 text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer"><i class="fa-regular fa-calendar-check w-6"></i> Quản Lý Lịch Hẹn</a></li>
                <li><a onclick="app.navigate('billing')" id="nav-billing" class="nav-item flex items-center px-6 py-3 text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer"><i class="fa-solid fa-file-invoice-dollar w-6"></i> Quản Lý Viện Phí</a></li>
            </ul>
        </nav>
        <div class="p-4 border-t border-slate-100">
            <button onclick="app.openAddPatient()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i> Thêm Bệnh Nhân
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen relative overflow-hidden bg-slate-50">
        <header class="md:hidden h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 z-20 shadow-sm shrink-0">
            <div class="flex items-center cursor-pointer" onclick="app.navigate('dashboard')">
                <i class="fa-solid fa-hospital-user text-primary text-xl mr-2"></i>
                <span class="font-bold text-slate-800">MediCare Pro</span>
            </div>
            <button class="text-slate-500 p-2 focus:outline-none" onclick="ui.toggleSidebar()"><i class="fa-solid fa-bars text-2xl"></i></button>
        </header>

        <div id="view-dashboard" class="view-section p-4 md:p-8 overflow-y-auto h-full fade-in block"></div>
        <div id="view-patients" class="view-section p-4 md:p-8 overflow-y-auto h-full fade-in hidden"></div>
        <div id="view-appointments" class="view-section p-4 md:p-8 overflow-y-auto h-full fade-in hidden"></div>
        <div id="view-billing" class="view-section p-4 md:p-8 overflow-y-auto h-full fade-in hidden"></div>
        <div id="view-patient-detail" class="view-section p-0 overflow-y-auto h-full fade-in hidden"></div>
    </main>

    <!-- Modals (Bệnh nhân, Lượt Khám, Thuốc, Lịch hẹn, Hóa đơn, Xác nhận) -->
    <!-- (Giữ nguyên cấu trúc HTML của các Modal từ phiên bản trước) -->
    <div id="modal-patient" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg modal-enter overflow-hidden flex flex-col max-h-full">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 shrink-0">
                <h3 id="modal-patient-title" class="font-bold text-lg text-slate-800">Thêm Bệnh Nhân Mới</h3>
                <button onclick="ui.closeModal('modal-patient')" class="text-slate-400 hover:text-rose-500 transition-colors p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto">
                <form id="form-patient" class="space-y-4">
                    <input type="hidden" id="inp_p_id">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Mã BN <span class="text-rose-500">*</span></label><input type="text" id="inp_p_code" required placeholder="Vd: BN0001" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-base"></div>
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Họ và Tên <span class="text-rose-500">*</span></label><input type="text" id="inp_p_name" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-base"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Giới tính</label><select id="inp_p_gender" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-base"><option value="Nam">Nam</option><option value="Nữ">Nữ</option></select></div>
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Ngày sinh</label><input type="date" id="inp_p_dob" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-base"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Số điện thoại</label><input type="tel" id="inp_p_phone" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-base"></div>
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Nhóm máu</label><select id="inp_p_blood" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-base"><option value="Chưa rõ">Chưa rõ</option><option value="A+">A+</option><option value="B+">B+</option><option value="O+">O+</option><option value="AB+">AB+</option></select></div>
                    </div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Chẩn đoán nền</label><input type="text" id="inp_p_diag" placeholder="Vd: Tăng huyết áp..." class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-base"></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Phân loại Rủi ro</label><select id="inp_p_risk" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-base"><option value="Low">Low (An toàn)</option><option value="Medium">Medium (Trung bình)</option><option value="High">High (Nguy cơ cao)</option></select></div>
                </form>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3 shrink-0">
                <button onclick="ui.closeModal('modal-patient')" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-md hover:bg-slate-100">Hủy</button>
                <button onclick="app.savePatient()" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-secondary shadow-sm">Lưu Hồ Sơ</button>
            </div>
        </div>
    </div>

    <!-- Modal Lượt Khám -->
    <div id="modal-visit" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg modal-enter overflow-hidden flex flex-col max-h-full">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-teal-50 shrink-0">
                <h3 id="modal-visit-title" class="font-bold text-lg text-teal-800"><i class="fa-solid fa-stethoscope mr-2"></i>Phiên Khám</h3>
                <button onclick="ui.closeModal('modal-visit')" class="text-slate-400 hover:text-rose-500 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto">
                <form id="form-visit" class="space-y-4">
                    <input type="hidden" id="inp_v_id">
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Ngày Khám</label><input type="date" id="inp_v_date" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary bg-slate-50 text-base"></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Lý do khám <span class="text-rose-500">*</span></label><textarea id="inp_v_complaint" rows="2" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-base"></textarea></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Đánh giá lâm sàng</label><textarea id="inp_v_assessment" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-base"></textarea></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Kế hoạch điều trị</label><textarea id="inp_v_plan" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary text-base"></textarea></div>
                </form>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3 shrink-0">
                <button onclick="ui.closeModal('modal-visit')" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-md hover:bg-slate-100">Hủy</button>
                <button onclick="app.saveVisit()" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-secondary shadow-sm">Lưu</button>
            </div>
        </div>
    </div>

    <!-- Modal Thuốc -->
    <div id="modal-medication" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg modal-enter overflow-hidden flex flex-col max-h-full">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-purple-50 shrink-0">
                <h3 id="modal-med-title" class="font-bold text-lg text-purple-800"><i class="fa-solid fa-capsules mr-2"></i>Kê Đơn Thuốc</h3>
                <button onclick="ui.closeModal('modal-medication')" class="text-slate-400 hover:text-rose-500 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto">
                <form id="form-med" class="space-y-4">
                    <input type="hidden" id="inp_m_id">
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Tên Thuốc <span class="text-rose-500">*</span></label><input type="text" id="inp_m_name" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 text-base"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Đường dùng</label><select id="inp_m_route" class="w-full px-3 py-2 border border-slate-300 rounded-md"><option value="Uống">Uống</option><option value="Tiêm">Tiêm</option><option value="Bôi">Bôi</option><option value="Khác">Khác</option></select></div>
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Tần suất</label><input type="text" id="inp_m_freq" class="w-full px-3 py-2 border border-slate-300 rounded-md text-base"></div>
                    </div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Trạng thái</label><select id="inp_m_status" class="w-full px-3 py-2 border border-slate-300 rounded-md"><option value="Active">Đang dùng</option><option value="Stopped">Đã ngưng</option></select></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Ghi chú</label><input type="text" id="inp_m_note" class="w-full px-3 py-2 border border-slate-300 rounded-md text-base"></div>
                </form>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3 shrink-0">
                <button onclick="ui.closeModal('modal-medication')" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-md hover:bg-slate-100">Hủy</button>
                <button onclick="app.saveMedication()" class="px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 shadow-sm">Lưu Thuốc</button>
            </div>
        </div>
    </div>

    <!-- Modal Lịch Hẹn -->
    <div id="modal-appointment" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md modal-enter overflow-hidden flex flex-col max-h-full">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-blue-50 shrink-0">
                <h3 id="modal-appointment-title" class="font-bold text-lg text-blue-800"><i class="fa-regular fa-calendar-plus mr-2"></i>Lịch Hẹn</h3>
                <button onclick="ui.closeModal('modal-appointment')" class="text-slate-400 hover:text-rose-500 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto">
                <form id="form-appointment" class="space-y-4">
                    <input type="hidden" id="inp_a_id">
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Bệnh Nhân <span class="text-rose-500">*</span></label><select id="inp_a_patient" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-base"></select></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Ngày Hẹn <span class="text-rose-500">*</span></label><input type="date" id="inp_a_date" required class="w-full px-3 py-2 border border-slate-300 rounded-md text-base"></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Mục đích hẹn</label><input type="text" id="inp_a_purpose" required class="w-full px-3 py-2 border border-slate-300 rounded-md text-base"></div>
                </form>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3 shrink-0">
                <button onclick="ui.closeModal('modal-appointment')" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-md hover:bg-slate-100">Hủy</button>
                <button onclick="app.saveAppointment()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 shadow-sm">Lưu</button>
            </div>
        </div>
    </div>

    <!-- Modal Hóa Đơn -->
    <div id="modal-invoice" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg modal-enter overflow-hidden flex flex-col max-h-full">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-orange-50 shrink-0">
                <h3 id="modal-invoice-title" class="font-bold text-lg text-orange-800"><i class="fa-solid fa-file-invoice-dollar mr-2"></i>Hóa Đơn Viện Phí</h3>
                <button onclick="ui.closeModal('modal-invoice')" class="text-slate-400 hover:text-rose-500 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto">
                <form id="form-invoice" class="space-y-4">
                    <input type="hidden" id="inp_i_id">
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Bệnh Nhân <span class="text-rose-500">*</span></label><select id="inp_i_patient" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none bg-slate-50 text-base"></select></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Ngày Lập</label><input type="date" id="inp_i_date" required class="w-full px-3 py-2 border border-slate-300 rounded-md text-base"></div>
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Tổng Tiền (VNĐ) <span class="text-rose-500">*</span></label><input type="number" id="inp_i_amount" required min="0" step="1000" class="w-full px-3 py-2 border border-slate-300 rounded-md text-base"></div>
                    </div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Nội dung thu <span class="text-rose-500">*</span></label><input type="text" id="inp_i_desc" required class="w-full px-3 py-2 border border-slate-300 rounded-md text-base"></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Trạng thái</label><select id="inp_i_status" class="w-full px-3 py-2 border border-slate-300 rounded-md"><option value="Unpaid">Chưa thanh toán</option><option value="Paid">Đã thanh toán</option></select></div>
                </form>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3 shrink-0">
                <button onclick="ui.closeModal('modal-invoice')" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-md hover:bg-slate-100">Hủy</button>
                <button onclick="app.saveInvoice()" class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 shadow-sm">Lưu</button>
            </div>
        </div>
    </div>

    <!-- Modal Xác nhận -->
    <div id="modal-confirm" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm modal-enter overflow-hidden">
            <div class="p-6 text-center">
                <div class="w-16 h-16 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-3xl mx-auto mb-4"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <h3 id="confirm-title" class="font-bold text-lg text-slate-800 mb-2">Xác nhận xóa</h3>
                <p id="confirm-msg" class="text-slate-500 text-sm">Hành động này không thể hoàn tác.</p>
            </div>
            <div class="px-6 py-4 bg-slate-50 flex justify-center gap-3 border-t border-slate-100">
                <button onclick="ui.closeModal('modal-confirm')" class="px-6 py-2 border border-slate-300 text-slate-700 rounded-md hover:bg-slate-100 font-medium">Hủy</button>
                <button onclick="app.confirmDelete()" class="px-6 py-2 bg-rose-600 text-white rounded-md hover:bg-rose-700 font-medium">Xóa vĩnh viễn</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-4 right-4 z-[70] flex flex-col gap-2 pointer-events-none w-64 md:w-auto left-1/2 -translate-x-1/2 md:left-auto md:translate-x-0"></div>

    <!-- TÍCH HỢP FIREBASE (Thay thế LocalStorage) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Cấu hình Database (Hệ thống tự động cấp phát khi xem trước, bạn sẽ thay khi tự host)
        const firebaseConfig = {

        // Lắng nghe dữ liệu Real-time từ Firebase
        function setupRealtimeListeners(uid) {
            const collections = ['patients', 'visits', 'appointments', 'medications', 'invoices'];
            let loadedCount = 0;

            collections.forEach(colName => {
                const colRef = collection(db, 'artifacts', appId, 'users', uid, colName);
                onSnapshot(colRef, (snapshot) => {
                    window.DB[colName] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    if (loadedCount < collections.length) {
                        loadedCount++;
                        if (loadedCount === collections.length) {
                            // Dữ liệu tải xong lần đầu
                            document.getElementById('app-loader').style.opacity = '0';
                            setTimeout(() => document.getElementById('app-loader').style.display = 'none', 300);
                            
                            // Tự động tạo dữ liệu mẫu nếu DB trống
                            if (window.DB.patients.length === 0) seedFirebaseDatabase(uid);
                            app.refreshCurrentView();
                        }
                    } else {
                        // Dữ liệu thay đổi sau khi đã tải
                        app.refreshCurrentView();
                    }
                }, (error) => console.error(`Error in ${colName}:`, error));
            });
        }

        }

        function renderAppointmentsList() {
            const container = document.getElementById('view-appointments');
            let list = window.DB.appointments.filter(a => a.status === app.apptTab).sort((a,b) => new Date(a.date) - new Date(b.date));
            container.innerHTML = `<div class="flex justify-between mb-4"><h1 class="text-2xl font-bold">Lịch Hẹn</h1><button onclick="app.openAddAppointment()" class="bg-blue-600 text-white px-4 py-2 rounded-lg">+ Tạo Lịch</button></div>
                <div class="flex gap-4 mb-4"><button onclick="app.apptTab='Scheduled'; app.refreshCurrentView()" class="px-4 py-2 border-b-2 ${app.apptTab==='Scheduled'?'border-blue-600 font-bold':''}">Sắp tới</button><button onclick="app.apptTab='Completed'; app.refreshCurrentView()" class="px-4 py-2 border-b-2 ${app.apptTab==='Completed'?'border-emerald-600 font-bold':''}">Đã khám</button></div>
                <div class="space-y-3">${list.map(a => { const p = window.DB.patients.find(x=>x.id===a.patient_id); return p ? `<div class="bg-white p-4 rounded-xl border flex justify-between"><div onclick="app.navigate('patient-detail',{id:'${p.id}'})" class="cursor-pointer"><p class="font-bold">${p.name}</p><p class="text-sm text-slate-500">${a.date} - ${a.purpose}</p></div><select onchange="app.markApptStatus('${a.id}', this.value)" class="text-xs border rounded p-1"><option value="Scheduled" ${a.status==='Scheduled'?'selected':''}>Sắp tới</option><option value="Completed" ${a.status==='Completed'?'selected':''}>Xong</option></select></div>`:'' }).join('')}</div>`;
        }

        function renderBillingList() {
            const container = document.getElementById('view-billing');
            let list = window.DB.invoices.sort((a,b) => new Date(b.date) - new Date(a.date));
            if(app.billFilter !== 'All') list = list.filter(i => i.status === app.billFilter);
            container.innerHTML = `<div class="flex justify-between mb-4"><h1 class="text-2xl font-bold">Viện Phí</h1><button onclick="app.openAddInvoice()" class="bg-orange-600 text-white px-4 py-2 rounded-lg">+ Tạo HĐ</button></div>
                <div class="flex gap-4 mb-4"><button onclick="app.billFilter='All'; app.refreshCurrentView()" class="px-4 py-2 border-b-2 ${app.billFilter==='All'?'border-orange-600 font-bold':''}">Tất cả</button><button onclick="app.billFilter='Unpaid'; app.refreshCurrentView()" class="px-4 py-2 border-b-2 ${app.billFilter==='Unpaid'?'border-rose-600 font-bold':''}">Chưa thu</button></div>
                <div class="space-y-3">${list.map(i => { const p = window.DB.patients.find(x=>x.id===i.patient_id); return p ? `<div class="bg-white p-4 rounded-xl border flex justify-between items-center"><div onclick="app.navigate('patient-detail',{id:'${p.id}', tab:'invoices'})" class="cursor-pointer"><p class="font-bold">${p.name}</p><p class="text-sm text-slate-500">${i.description}</p></div><div class="text-right"><p class="font-bold text-lg">${formatCurrency(i.amount)}</p><select onchange="app.markInvoiceStatus('${i.id}', this.value)" class="text-xs border rounded p-1 ${i.status==='Paid'?'bg-emerald-50':'bg-rose-50'}"><option value="Unpaid" ${i.status==='Unpaid'?'selected':''}>Chưa thu</option><option value="Paid" ${i.status==='Paid'?'selected':''}>Đã thu</option></select></div></div>`:'' }).join('')}</div>`;
        }

        function renderPatientDetail() {
            const container = document.getElementById('view-patient-detail');
            const p = window.DB.patients.find(x=>x.id === app.selectedPatientId); if(!p) return;
            container.innerHTML = `<div class="bg-white p-6 border-b shrink-0"><div class="flex justify-between mb-4"><button onclick="app.navigate('patients')"><i class="fa-solid fa-arrow-left"></i> Trở về</button><button onclick="app.requestDelete('patient', '${p.id}')" class="text-rose-500">Xóa</button></div>
                <h1 class="text-2xl font-bold">${p.name} <span class="text-sm font-normal text-slate-500 bg-slate-100 px-2 py-1 rounded">${p.code}</span></h1><p class="text-slate-600 mt-2">${p.gender} | ${p.dob} | SĐT: ${p.phone}</p>
                <div class="flex gap-4 mt-6 overflow-x-auto border-b"><button onclick="app.setDetailTab('overview')" class="pb-2 border-b-2 ${app.detailTab==='overview'?'border-primary text-primary font-bold':'border-transparent'}">Tổng quan</button><button onclick="app.setDetailTab('visits')" class="pb-2 border-b-2 ${app.detailTab==='visits'?'border-primary text-primary font-bold':'border-transparent'}">Lượt khám</button><button onclick="app.setDetailTab('meds')" class="pb-2 border-b-2 ${app.detailTab==='meds'?'border-primary text-primary font-bold':'border-transparent'}">Đơn thuốc</button><button onclick="app.setDetailTab('appointments')" class="pb-2 border-b-2 ${app.detailTab==='appointments'?'border-primary text-primary font-bold':'border-transparent'}">Lịch hẹn</button><button onclick="app.setDetailTab('invoices')" class="pb-2 border-b-2 ${app.detailTab==='invoices'?'border-primary text-primary font-bold':'border-transparent'}">Viện phí</button></div></div>
                <div id="detail-tab-content" class="p-6 flex-1 overflow-y-auto"></div>`;
            renderPatientDetailTabs();
        }

        function renderPatientDetailTabs() {
            const c = document.getElementById('detail-tab-content'); const p = window.DB.patients.find(x=>x.id === app.selectedPatientId);
            if(app.detailTab === 'overview') {
                const v = window.DB.visits.filter(x=>x.patient_id===p.id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
                c.innerHTML = `<div class="bg-white p-6 rounded-xl shadow-sm border"><h3 class="font-bold mb-2">Chẩn đoán:</h3><p>${p.diagnosis}</p><h3 class="font-bold mt-4 mb-2">Lần khám gần nhất:</h3>${v ? `<p>${v.date}: ${v.complaint}</p>`:'Chưa có'}</div>`;
            } else if(app.detailTab === 'visits') {
                c.innerHTML = `<button onclick="app.openAddVisit()" class="mb-4 bg-teal-600 text-white px-4 py-2 rounded">Thêm Khám</button><div class="space-y-4">${window.DB.visits.filter(x=>x.patient_id===p.id).map(v=>`<div class="p-4 bg-white border rounded"><p class="font-bold">${v.date}</p><p>${v.complaint}</p></div>`).join('')}</div>`;
            } else if(app.detailTab === 'meds') {
                c.innerHTML = `<div class="mb-4"><button onclick="app.printPrescription()" class="bg-slate-200 px-4 py-2 rounded mr-2">In Đơn</button><button onclick="app.openAddMedication()" class="bg-purple-600 text-white px-4 py-2 rounded">Kê thuốc</button></div><div class="space-y-2">${window.DB.medications.filter(x=>x.patient_id===p.id).map(m=>`<div class="p-4 bg-white border rounded flex justify-between"><div><p class="font-bold">${m.name}</p><p class="text-sm">${m.route} - ${m.freq}</p></div><button onclick="app.requestDelete('medication','${m.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></div>`).join('')}</div>`;
            } else if(app.detailTab === 'appointments') {
                 c.innerHTML = `<button onclick="app.openAddAppointment()" class="mb-4 bg-blue-600 text-white px-4 py-2 rounded">Tạo lịch</button><div class="space-y-2">${window.DB.appointments.filter(x=>x.patient_id===p.id).map(a=>`<div class="p-4 bg-white border rounded"><p class="font-bold">${a.date}</p><p>${a.purpose}</p></div>`).join('')}</div>`;
            } else if(app.detailTab === 'invoices') {
                c.innerHTML = `<button onclick="app.openAddInvoice()" class="mb-4 bg-orange-600 text-white px-4 py-2 rounded">Tạo HĐ</button><div class="space-y-2">${window.DB.invoices.filter(x=>x.patient_id===p.id).map(i=>`<div class="p-4 bg-white border rounded flex justify-between"><p>${i.date} - ${i.description}</p><p class="font-bold">${formatCurrency(i.amount)}</p></div>`).join('')}</div>`;
            }
        }

        // Bắt đầu ứng dụng
        initAuth();
    </script>
</body>
</html>
